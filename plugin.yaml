name: plugin-scout
version: 0.2.0
manifest_version: 2
description: "Knows how you use Hermes and what is in the catalog: picks plugins that fit you (with the evidence), flags heads-ups for your setup and clashes between plugins, and sends a quiet weekly note. Recommends only."
author: "Bryon Scharenberg"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - scout_conflicts
  - scout_whats_new
  - scout_picks
  - scout_weekly
  - scout_profile
  - scout_start
  - scout_interests
  - scout_dismiss
provides_hooks: []
